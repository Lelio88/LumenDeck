<!DOCTYPE html>
<html>

<head lang="en">
    <title>Brightness settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Bulb" data-i18n-label="pi.bulb">
        <sdpi-select setting="deviceId" datasource="getBulbs" placeholder="Choose a bulb"
                     data-i18n-placeholder="pi.bulbPlaceholder"></sdpi-select>
    </sdpi-item>

    <sdpi-item label="Step" data-i18n-label="pi.step">
        <sdpi-range setting="step" min="-25" max="25" step="5" default="10" showlabels></sdpi-range>
    </sdpi-item>

    <details>
        <summary data-i18n="pi.manage">Add or edit a bulb</summary>
        <div id="bulb-manager"></div>
    </details>

    <details>
        <summary data-i18n="pi.stepHelp.title">What is the step for?</summary>
        <p data-i18n="pi.stepHelp.key">On a key, each press applies this step. A negative value makes a &ldquo;dim&rdquo; key: place two side by side, one at +10 and one at -10.</p>
        <p data-i18n="pi.stepHelp.dial">On a dial, the step is the value of one detent; its sign is ignored, the direction of rotation decides.</p>
    </details>

    <script src="bulbs.js"></script>
</body>

</html>
