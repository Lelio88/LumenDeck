<!DOCTYPE html>
<html>

<head lang="en">
    <title>Power settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Bulb" data-i18n-label="pi.bulb">
        <sdpi-select setting="deviceId" datasource="getBulbs" placeholder="Choose a bulb"
                     data-i18n-placeholder="pi.bulbPlaceholder"></sdpi-select>
    </sdpi-item>

    <details>
        <summary data-i18n="pi.manage">Add or edit a bulb</summary>
        <div id="bulb-manager"></div>
    </details>

    <details>
        <summary data-i18n="pi.shared.title">One bulb, many keys</summary>
        <p data-i18n="pi.shared.body">Bulbs are declared once for the whole plugin. Every key picks from the same list: no need to retype the key each time, and a changed key is fixed in a single place.</p>
    </details>

    <script src="bulbs.js"></script>
</body>

</html>
