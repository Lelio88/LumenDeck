<!DOCTYPE html>
<html>

<head lang="fr">
    <title>Allumer / eteindre</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Ampoule">
        <sdpi-select setting="deviceId" datasource="getBulbs" placeholder="Choisissez une ampoule"></sdpi-select>
    </sdpi-item>

    <details>
        <summary>Ajouter ou modifier une ampoule</summary>
        <div id="bulb-manager"></div>
    </details>

    <details>
        <summary>Une ampoule, plusieurs touches</summary>
        <p>
            Les ampoules se declarent une seule fois pour tout le plugin. Toutes vos touches
            piochent dans la meme liste : inutile de ressaisir la cle a chaque fois, et une
            cle changee ne se corrige qu'a un seul endroit.
        </p>
    </details>

    <script src="bulbs.js"></script>
</body>

</html>
