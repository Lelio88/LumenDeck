<!DOCTYPE html>
<html>

<head lang="en">
    <title>White settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Bulb" data-i18n-label="pi.bulb">
        <sdpi-select setting="deviceId" datasource="getBulbs" placeholder="Choose a bulb"
                     data-i18n-placeholder="pi.bulbPlaceholder"></sdpi-select>
    </sdpi-item>

    <sdpi-item label="Temperature" data-i18n-label="pi.temperature">
        <sdpi-range setting="kelvin" min="2700" max="6500" step="100" default="4000" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="Dial step" data-i18n-label="pi.dialStep">
        <sdpi-range setting="step" min="50" max="500" step="50" default="200" showlabels></sdpi-range>
    </sdpi-item>

    <details>
        <summary data-i18n="pi.manage">Add or edit a bulb</summary>
        <div id="bulb-manager"></div>
    </details>

    <details>
        <summary data-i18n="pi.tempHelp.title">Temperature landmarks</summary>
        <p data-i18n="pi.tempHelp.scale">2700 K matches an incandescent bulb, very warm. 4000 K is a neutral white. 6500 K is daylight, cool and blue.</p>
        <p data-i18n="pi.tempHelp.mode">Applying a temperature switches the bulb to white mode, so it leaves colour behind. The bulb imposes this, not the plugin.</p>
    </details>

    <script src="bulbs.js"></script>
</body>

</html>
