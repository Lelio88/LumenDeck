[package]
name = "lumendeck-capture"
version = "0.1.0"
edition = "2021"
description = "Capteur d'ecran de LumenDeck : mesure la couleur de l'ecran par zones, sans rien savoir des ampoules."

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
