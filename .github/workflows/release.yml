# Fabrique le paquet installable et l'attache a la release.
#
# Pourquoi une action plutot qu'un `npm run pack` lance a la main : le fichier
# publie doit correspondre exactement au tag, construit depuis un depot propre.
# Un paquet fabrique sur un poste de developpement embarque ce qui trainait dans
# le dossier — un bundle pas recompile, une icone en cours de retouche — et
# personne ne s'en apercoit avant que quelqu'un l'installe.
#
# Declenchement : pousser un tag `v*`.
#   git tag v0.11.0 && git push origin v0.11.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Version imposee par le SDK Elgato, cf. le champ Nodejs du manifeste.
          node-version: "24"
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier
        # Le paquet ne part que si les tests passent et si le manifeste est
        # valide : une release cassee se retire mal, les gens l'ont deja.
        run: |
          npm test
          npm run build
          npx streamdeck validate com.lumendeck.bulb.sdPlugin

      - name: Fabriquer le paquet
        run: npx streamdeck pack com.lumendeck.bulb.sdPlugin --output dist --force

      - name: Verifier que le tag correspond a la version du manifeste
        # Un tag qui ment sur la version rend le suivi des bugs impossible.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFESTE=$(node -p "require('./com.lumendeck.bulb.sdPlugin/manifest.json').Version")
          echo "tag=$TAG  manifeste=$MANIFESTE"
          case "$MANIFESTE" in
            "$TAG"|"$TAG".*) ;;
            *) echo "::error::Le tag $TAG ne correspond pas au manifeste $MANIFESTE"; exit 1 ;;
          esac

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/com.lumendeck.bulb.streamDeckPlugin
          generate_release_notes: true
